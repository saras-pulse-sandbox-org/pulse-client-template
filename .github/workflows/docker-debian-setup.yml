name: Docker Debian Setup

on:
  push:
    branches:
      - infra/main
    paths:
      - ".github/workflows/docker-debian-setup.yml"
  workflow_dispatch:
    inputs:
      instance_name:
        description: "VM Instance Name"
        required: true
        default: "pulse-vm-instance"
      zone:
        description: "GCP Zone"
        required: true
        default: "us-central1-f"
      project_id:
        description: "GCP Project ID"
        required: true
        default: "insightsprod"

env:
  INSTANCE_NAME: ${{ github.event.inputs.instance_name || vars.VM_INSTANCE_NAME }}
  ZONE: ${{ github.event.inputs.zone || vars.VM_ZONE }}
  PROJECT_ID: ${{ github.event.inputs.project_id || vars.GCP_PROJECT_ID }}

jobs:
  setup-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Copy installation script to VM
        run: |
          gcloud compute scp scripts/install_docker.sh \
            ${{ env.INSTANCE_NAME }}:/tmp/install_docker.sh \
            --zone=${{ env.ZONE }}

      - name: Execute installation script
        run: |
          gcloud compute ssh ${{ env.INSTANCE_NAME }} \
            --zone=${{ env.ZONE }} \
            --command="bash /tmp/install_docker.sh"