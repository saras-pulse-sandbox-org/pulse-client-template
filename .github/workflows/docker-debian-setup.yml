name: Docker Debian Setup

on:
  push:
    branches:
      - infra/main
    paths:
      - ".github/workflows/docker-debian-setup.yml"
  workflow_dispatch:
    inputs:
      instance_name:
        description: "VM Instance Name"
        required: true
        default: "pulse-vm-instance"
      zone:
        description: "GCP Zone"
        required: true
        default: "us-central1-f"
      project_id:
        description: "GCP Project ID"
        required: true
        default: "insightsprod"

jobs:
  setup-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ inputs.project_id || github.event.inputs.project_id || 'insightsprod' }}

      - name: Copy installation script to VM
        run: |
          INSTANCE_NAME="${{ inputs.instance_name || github.event.inputs.instance_name || 'pulse-vm-instance' }}"
          ZONE="${{ inputs.zone || github.event.inputs.zone || 'us-central1-f' }}"
          
          gcloud compute scp scripts/install_docker.sh \
            $INSTANCE_NAME:/tmp/install_docker.sh \
            --zone=$ZONE

      - name: Execute installation script
        run: |
          INSTANCE_NAME="${{ inputs.instance_name || github.event.inputs.instance_name || 'pulse-vm-instance' }}"
          ZONE="${{ inputs.zone || github.event.inputs.zone || 'us-central1-f' }}"
          
          gcloud compute ssh $INSTANCE_NAME \
            --zone=$ZONE \
            --command="bash /tmp/install_docker.sh"