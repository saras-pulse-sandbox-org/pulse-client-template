name: Create GCP VM

on:
  push:
    branches:
      - infra/main
    paths:
      - ".github/workflows/create-gcp-vm.yml"
  workflow_dispatch:
    inputs:
      instance_name:
        description: "VM Instance Name"
        required: true
        default: "pulse-vm-instance"
      zone:
        description: "GCP Zone"
        required: true
        default: "us-central1-f"
      machine_type:
        description: "Machine Type"
        required: true
        default: "e2-standard-8"
      disk_size:
        description: "Boot Disk Size (GB)"
        required: true
        default: "20"
      project_id:
        description: "GCP Project ID"
        required: true
        default: "insightsprod"
      setup_docker:
        description: "Install Docker after VM creation"
        type: boolean
        required: true
        default: false

jobs:
  create-vm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      instance_name: ${{ github.event.inputs.instance_name }}
      zone: ${{ github.event.inputs.zone }}
      project_id: ${{ github.event.inputs.project_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ github.event.inputs.project_id }}

      - name: Create VM Instance
        run: |
          gcloud compute instances create ${{ github.event.inputs.instance_name }} \
            --project=${{ github.event.inputs.project_id }} \
            --zone=${{ github.event.inputs.zone }} \
            --machine-type=${{ github.event.inputs.machine_type }} \
            --network-interface=network-tier=PREMIUM,stack-type=IPV4_ONLY,subnet=default \
            --maintenance-policy=MIGRATE \
            --provisioning-model=STANDARD \
            --service-account=165971167981-compute@developer.gserviceaccount.com \
            --scopes=https://www.googleapis.com/auth/cloud-platform \
            --tags=http-server,https-server,lb-health-check \
            --create-disk=auto-delete=yes,boot=yes,device-name=${{ github.event.inputs.instance_name }},image=projects/debian-cloud/global/images/debian-12-bookworm-v20241009,mode=rw,size=${{ github.event.inputs.disk_size }},type=pd-balanced \
            --no-shielded-secure-boot \
            --shielded-vtpm \
            --shielded-integrity-monitoring \
            --labels=goog-ec-src=vm_add-gcloud \
            --reservation-affinity=any

  trigger-docker-setup:
    needs: create-vm
    if: ${{ github.event.inputs.setup_docker == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Trigger Docker Setup Workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docker-debian-setup.yml',
              ref: 'main',
              inputs: {
                instance_name: '${{ needs.create-vm.outputs.instance_name }}',
                zone: '${{ needs.create-vm.outputs.zone }}',
                project_id: '${{ needs.create-vm.outputs.project_id }}'
              }
            })
