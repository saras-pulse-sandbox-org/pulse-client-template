name: Create GCP VM

on:
  push:
    branches:
      - infra/main
    paths:
      - ".github/workflows/create-gcp-vm.yml"
  workflow_dispatch:
    inputs:
      instance_name:
        description: "VM Instance Name"
        required: true
        default: "pulse-vm-instance"
      zone:
        description: "GCP Zone"
        required: true
        default: "us-central1-f"
      machine_type:
        description: "Machine Type"
        required: true
        default: "e2-standard-8"
      disk_size:
        description: "Boot Disk Size (GB)"
        required: true
        default: "20"
      project_id:
        description: "GCP Project ID"
        required: true
        default: "insightsprod"

env:
  INSTANCE_NAME: ${{ github.event.inputs.instance_name || vars.VM_INSTANCE_NAME }}
  ZONE: ${{ github.event.inputs.zone || vars.VM_ZONE }}
  PROJECT_ID: ${{ github.event.inputs.project_id || vars.GCP_PROJECT_ID }}
  MACHINE_TYPE: ${{ github.event.inputs.machine_type || vars.VM_MACHINE_TYPE }}
  DISK_SIZE: ${{ github.event.inputs.disk_size || vars.VM_DISK_SIZE }}

jobs:
  create-vm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      instance_name: ${{ env.INSTANCE_NAME }}
      zone: ${{ env.ZONE }}
      project_id: ${{ env.PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Check if VM already exists
        id: check-vm
        run: |
          if gcloud compute instances describe ${{ env.INSTANCE_NAME }} \
            --project=${{ env.PROJECT_ID }} \
            --zone=${{ env.ZONE }} &>/dev/null; then
            echo "VM ${{ env.INSTANCE_NAME }} already exists in zone ${{ env.ZONE }}."
            echo "vm_exists=true" >> $GITHUB_OUTPUT
          else
            echo "VM ${{ env.INSTANCE_NAME }} does not exist in zone ${{ env.ZONE }}. Will create it."
            echo "vm_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create VM Instance
        if: steps.check-vm.outputs.vm_exists == 'false'
        run: |
          gcloud compute instances create ${{ env.INSTANCE_NAME }} \
            --project=${{ env.PROJECT_ID }} \
            --zone=${{ env.ZONE }} \
            --machine-type=${{ env.MACHINE_TYPE }} \
            --network-interface=network-tier=PREMIUM,stack-type=IPV4_ONLY,subnet=default \
            --maintenance-policy=MIGRATE \
            --provisioning-model=STANDARD \
            --service-account=165971167981-compute@developer.gserviceaccount.com \
            --scopes=https://www.googleapis.com/auth/cloud-platform \
            --tags=http-server,https-server,lb-health-check \
            --create-disk=auto-delete=yes,boot=yes,device-name=${{ env.INSTANCE_NAME }},image=projects/debian-cloud/global/images/debian-12-bookworm-v20241009,mode=rw,size=${{ env.DISK_SIZE }},type=pd-balanced \
            --no-shielded-secure-boot \
            --shielded-vtpm \
            --shielded-integrity-monitoring \
            --labels=goog-ec-src=vm_add-gcloud \
            --reservation-affinity=any

      - name: Exit workflow if VM already exists
        if: steps.check-vm.outputs.vm_exists == 'true'
        run: |
          echo "VM ${{ env.INSTANCE_NAME }} already exists. Skipping VM creation."
          exit 0

  trigger-docker-setup:
    needs: create-vm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Trigger Docker Setup Workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docker-debian-setup.yml',
              ref: 'infra/main',
              inputs: {
                instance_name: '${{ needs.create-vm.outputs.instance_name }}',
                zone: '${{ needs.create-vm.outputs.zone }}',
                project_id: '${{ needs.create-vm.outputs.project_id }}'
              }
            })
